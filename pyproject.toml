[project]
name = "enterprise-agentic-intelligence-platform"
version = "0.1.0"
description = "Provider-neutral, evidence-first enterprise agentic intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk>=1.1.2",
    "fastapi>=0.116.0,<1.0.0",
    "google-adk>=2.7.1",
    "mcp>=2.1.1",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=1.17.0,<2.0.0",
    "pre-commit>=4.3.0,<5.0.0",
    "pytest>=8.4.0,<10.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "enterprise_ai"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore:BaseAgentConfig is deprecated and will be removed in future versions.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
